<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LucyCare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.5.0/remixicon.min.css">

  </head>
  <body>
    <div id="root">
      <!-- Splash estático: visible solo durante el bootstrap (validación de
           sesión con timeout, main.tsx). React lo reemplaza al renderizar.
           Evita la pantalla blanca pura en redes lentas (móvil). -->
      <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#ffffff;font-family:system-ui,-apple-system,sans-serif;">
        <div style="font-size:26px;font-weight:600;color:#047857;letter-spacing:-0.5px;">LucyCare</div>
        <div style="margin-top:18px;width:28px;height:28px;border:3px solid #d1fae5;border-top-color:#047857;border-radius:50%;animation:boot-spin .8s linear infinite;"></div>
        <style>@keyframes boot-spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
